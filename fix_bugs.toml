# Relatório de Bugs Críticos e Vulnerabilidades/Falhas Operacionais
# Projeto: xterminium

[meta]
title = "Relatório de Bugs Críticos e Falhas Operacionais"
data = "2026-09-08"
versao_projeto = "0.0.7-alpha"

[[bugs]]
id = "BUG-01"
criticidade = "CRITICA"
titulo = "Comando sudo local executa string desescapada via shell sh -c gerando Command Injection"
arquivo = "sudo.rs"
descricao = "Na função exec_local_sudo, o comando recebido é passado diretamente para 'sh -c <command>' com o input do usuário concatenado sem sanitização ou escape. Qualquer caractere especial como aspas, ponto-e-vírgula ou redirecionamentos executados com privilégio de root/sudo pode sofrer injeção de comandos arbitrários no sistema operacional host."
correcao = "Evitar invocação direta via 'sh -c' de strings interpoladas sem escape, ou utilizar argumentos estruturados e validar rigorosamente o comando antes da execução, garantindo que variáveis como nomes de arquivos ou caminhos sejam passadas como argumentos seguros ou sanitizadas antes de compor a linha de comando."
status = "finalizado"

[[bugs]]
id = "BUG-02"
criticidade = "CRITICA"
titulo = "Vazamento de descritores de arquivo e travamento de concorrência em leitura/escrita concorrente do SFTP"
arquivo = "transfer.rs"
descricao = "No download concorrente particionado de arquivos grandes (download_file), cada uma das 8 threads/tasks assíncronas abre um novo handle remoto de arquivo com 'sftp_clone.open()'. Em casos de erro, falha de rede ou timeout no meio da transferência, handles remotos podem não ser fechados explicitamente via '.close().await', sobrecarregando o limite de canais/arquivos abertos do servidor SSH e travando sessões subsequentes."
correcao = "Implementar bloco de finalização/defer para garantir que 'remote_file.close().await' seja executado em todas as saídas de erro e sucesso de cada worker task, além de capturar cancelamentos de task."
status = "finalizado"

[[bugs]]
id = "BUG-03"
criticidade = "ALTA"
titulo = "Cancelamento e saída precoce de abas SFTP deixam downloads/uploads em background sem abortar conexão"
arquivo = "useSftpTransfer.svelte.ts"
descricao = "Se o usuário fechar a aba de SFTP ou o modal de gerenciamento de arquivos enquanto uma transferência de grande porte está em execução, a requisição do backend Rust continua transferindo bytes indefinidamente até o fim do arquivo, sem existir mecanismo de abortar/cancelar a task tokio via evento do frontend."
correcao = "Adicionar um canal de cancelamento (tokio::sync::watch ou CancellationToken) associado à sessão/transferência e expor um comando tauri 'sftp_cancel_transfer', disparando-o no onDestroy ou ao desconectar/fechar a aba."
status = "finalizado"

[[bugs]]
id = "BUG-04"
criticidade = "ALTA"
titulo = "Injeção de aspas ou quebras de linha em paths enviados via PTY ao navegar silenciosamente"
arquivo = "App.svelte"
descricao = "Na função navigateSilently(path), o caminho é interpolado na linha de comando enviada ao PTY: 'cd ' + JSON.stringify(path) + '\\n'. Se um diretório contiver quebras de linha, caracteres de escape ANSI ou seqüências especiais de terminal, o comando pode quebrar a linha prematuramente e disparar comandos indesejados no terminal sem que o usuário perceba antes do timeout."
correcao = "Sanitizar o path para remover caracteres de controle e quebras de linha (\\r, \\n) antes de despachar a instrução 'cd' para o PTY."
status = "finalizado"

[[bugs]]
id = "BUG-05"
criticidade = "MEDIA"
titulo = "Falta de verificação e aceitação cega de host key SSH sem validação do known_hosts"
arquivo = "session.rs"
descricao = "A implementação de russh::client::Handler (ClientHandler) implementa check_server_key retornando incondicionalmente 'Ok(true)'. Isso desabilita a proteção contra ataques Man-In-The-Middle (MITM) na camada SSH ao conectar em novas máquinas ou se o host sofrer spoofing de DNS/IP."
correcao = "Verificar as chaves conhecidas no arquivo ~/.ssh/known_hosts e avisar o usuário se a chave do servidor divergir ou for nova antes de permitir a conexão com o host remoto."
status = "finalizado"

[[bugs]]
id = "BUG-06"
criticidade = "MEDIA"
titulo = "Race condition na contagem de caracteres apagados (\x7f) ao disparar aliases rapidamente"
arquivo = "TerminalView.svelte"
descricao = "Ao disparar um alias com Enter, o callback de keydown intercepta o Enter e envia os backspaces imediatamente via PtyService. Se o usuário digitar caracteres muito rapidamente, o evento 'onData' do xterm pode processar o input após o backspace ter sido despachado, gerando lixo no prompt ou executando comandos corrompidos."
correcao = "Manter um flag de bloqueio momentâneo no 'term.onData' durante a janela de aplicação de substituição de alias (debounce de 50ms) para sincronizar o PTY antes de aceitar nova digitação."
status = "finalizado"

