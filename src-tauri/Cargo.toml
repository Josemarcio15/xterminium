[package]
name = "xterminium"
version = "0.0.5-alpha"
description = "A modern, fast and customizable desktop terminal emulator built with Tauri and Svelte"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2.0"
async-trait = "0.1"
futures = "0.3.34"
sha2 = "0.10.9"

